# Runs on every push and pull request. It needs no secret and no API key.
# The eval harness (eval/) is run by hand and never runs here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      # The GitHub Ubuntu image has Google Chrome. If it is missing, browser tests
      # are skipped, and the pytest summary lists each skip with its reason.
      - name: Show the Chrome version
        run: google-chrome --version || echo "::warning::Chrome is not installed, so browser tests will be skipped"

      - name: Lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Type check
        run: uv run --locked ty check src tests eval

      - name: Drift tests
        run: uv run --locked pytest tests/test_drift.py -v

      - name: Full test suite
        run: uv run --locked pytest -rs
